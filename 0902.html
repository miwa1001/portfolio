<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFE66F;
  --card: #F3F3FA;
  --text: #182230;
  --muted: #626c7d;
  --primary: #5b67f1;
  --primary2: #7c5cff;
  --green: #16a673;
  --red: #e95c68;
  --border: #7c889b;
  --shadow: 0 12px 35px rgba(31, 42, 68, 0.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Huninn", "jf-openhuninn", "jf open 粉圓", "Open Huninn", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  font-size: 17px;
  background: var(--bg);
  color: var(--text);
  font-weight: 700;
  letter-spacing: 1px;
}
button, input, select { font: inherit; letter-spacing: inherit; }
.app { max-width: 1180px; margin: auto; padding: 28px 20px 50px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
}
.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
h1 { font-size: 25px; margin: 0; }
.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary2));
  color: white;
  padding: 12px 20px;
  border: 0;
  border-radius: 12px;
  font-weight: 700;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 7px 18px rgba(91, 103, 241, 0.2);
  transition: opacity 0.2s;
}
.primary:hover { opacity: 0.92; }

.monthbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 12px 16px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.monthbar button {
  background: #eef0f5;
  border: 2px solid var(--border);
  color: #445066;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  font-size: 22px;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.month-label { font-size: 29px; font-weight: 800; }

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 18px;
}
.card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.metric .label { color: var(--muted); font-size: 16px; }
.metric .value { font-size: 32px; font-weight: 800; margin-top: 8px; }
.income { color: var(--green); }
.expense { color: var(--red); }

.content {
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  gap: 18px;
}
.right-col {
  display: flex;
  flex-direction: column;
  gap: 18px;
  height: 100%;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
  gap: 12px;
}
.section-title h2 { font-size: 26px; margin: 0; line-height: 1.2; }

.filters { display: flex; flex-direction: column; gap: 8px; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.filters select, .filters input {
  padding: 9px 11px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  outline: none;
}
.filter-row input#search { width: 100%; }

.tx {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 2px solid var(--border);
}
.tx:last-child { border-bottom: 0; }
.icon {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: #eef0ff;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 24px;
  flex-shrink: 0;
}
.tx-main { flex: 1; min-width: 0; }
.tx-title { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 16px; color: var(--muted); margin-top: 3px; }
.tx-note { font-size: 16px; color: var(--muted); margin-top: 4px; word-break: break-all; line-height: 1.3; }
.amount { font-weight: 800; white-space: nowrap; font-size: 23px; }
.plus { color: var(--green); }
.minus { color: var(--red); }
.tx-actions { display: flex; gap: 6px; }
.smallbtn {
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #ffffff;
  color: #475269;
  font-size: 18px;
  cursor: pointer;
}
.smallbtn.danger { background: #fff0f1; color: var(--red); }

.chartbox { display: flex; justify-content: center; align-items: center; min-height: 380px; padding: 10px 0; }
.pie { width: 360px; height: 360px; border-radius: 50%; position: relative; flex-shrink: 0; }
.pie-center {
  position: absolute;
  z-index: 1;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  pointer-events: none;
}
.pie-center span { font-size: 16px; color: var(--muted); line-height: 1.2; }
.pie-center b { display: block; font-size: 26px; color: var(--text); margin-top: 4px; line-height: 1.2; }

/* 圓餅圖區塊互動樣式 */
.pie-slice {
  cursor: pointer;
  transition: opacity 0.2s, transform 0.2s, stroke 0.2s;
  transform-origin: 180px 180px;
}
.pie-slice:hover {
  opacity: 0.88;
  transform: scale(1.03);
}
.pie-slice.dimmed {
  opacity: 0.3;
}
.pie-slice.dimmed:hover {
  opacity: 0.65;
}
.pie-slice.selected {
  opacity: 1;
  stroke: #ffffff !important;
  stroke-width: 3px !important;
  transform: scale(1.04);
}

/* 懸浮提示視窗 */
.pie-tooltip {
  position: absolute;
  padding: 8px 14px;
  background: rgba(24, 34, 48, 0.92);
  color: #ffffff;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  transform: translate(-50%, -125%);
  transition: opacity 0.15s ease;
  opacity: 0;
  z-index: 10;
  display: none;
}
.pie-tooltip.show {
  display: block;
  opacity: 1;
}

.legend { display: grid; gap: 9px; margin-top: 10px; }
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s;
  border: 1px solid transparent;
}
.legend-row:hover {
  background: rgba(91, 103, 241, 0.08);
}
.legend-row.selected {
  background: rgba(91, 103, 241, 0.15);
  font-weight: 800;
  border-color: var(--primary);
}
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border); }
.legend-row span:nth-child(2) { flex: 1; }
.legend-row .val { color: var(--muted); }

.bars { display: flex; align-items: flex-end; gap: 6px; height: 230px; padding: 15px 5px 5px; }
.bar-wrap { height: 100%; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; }
.bar {
  width: 100%;
  max-width: 36px;
  border-radius: 8px 8px 3px 3px;
  background: linear-gradient(180deg, var(--primary), #9d86ff);
  border: 1px solid var(--border);
  min-height: 4px;
}
.bar-label { font-size: 15px; color: var(--muted); }
.empty { text-align: center; padding: 35px 10px; color: var(--muted); }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(16, 24, 39, 0.45);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 10;
}
.modal.show { display: flex; }
.dialog {
  background: var(--card);
  width: 92%;
  max-width: 720px;
  max-height: 88vh;
  overflow-y: auto;
  border-radius: 22px;
  padding: 28px 34px;
  border: 2px solid var(--border);
  box-shadow: 0 25px 70px rgba(17, 24, 39, 0.2);
}
.dialog h2 { margin: 0 0 18px; font-size: 24px; }
.form { display: grid; gap: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field label { display: block; font-size: 21px; color: var(--muted); margin-bottom: 6px; }
.field input, .field select {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: #ffffff;
  color: var(--text);
  font-size: 16px;
}
.field input:focus, .field select:focus { border-color: var(--primary); }

.type { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type button {
  padding: 11px;
  border: 2px solid var(--border);
  border-radius: 11px;
  background: #ffffff;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}
.type .active {
  background: #eef0ff;
  border-color: var(--primary);
  color: var(--primary);
}
.actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
.cancel { padding: 11px 22px; border-radius: 11px; border: 2px solid var(--border); background: #ffffff; color: #4c5669; font-size: 16px; cursor: pointer; }
.btn-danger { padding: 11px 22px; border-radius: 11px; border: 0; background: var(--red); color: white; font-weight: 700; font-size: 16px; cursor: pointer; }

@media(max-width:800px){
  .grid { grid-template-columns: 1fr; }
  .content { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .app { padding: 18px 13px 35px; }
  .month-label { font-size: 23px; }
  .section-title h2 { font-size: 22px; }
  .pie { width: 280px; height: 280px; }
  .chartbox { min-height: 300px; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo">
        <img src="https://miwa1001.github.io/desktoppet/animal_usagi.png" alt="Usagi Logo" onerror="this.onerror=null; this.src='https://placehold.co/46x46/5b67f1/ffffff?text=🐰';">
      </div>
      <div>
        <h1>我的記帳本</h1>
      </div>
    </div>
    <button class="primary" onclick="openModal()">＋ 新增記帳</button>
  </header>

  <!-- 月份切換 -->
  <div class="monthbar">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <!-- 統計指標 -->
  <section class="grid">
    <div class="card metric"><div class="label">本月結餘</div><div class="value" id="balance">$0</div></div>
    <div class="card metric"><div class="label">本月收入</div><div class="value income" id="income">$0</div></div>
    <div class="card metric"><div class="label">本月支出</div><div class="value expense" id="expense">$0</div></div>
  </section>

  <!-- 主要內容區 -->
  <div class="content">
    <section class="card" style="display: flex; flex-direction: column;">
      <div class="section-title">
        <h2>交易紀錄</h2>
        <div class="filters">
          <div class="filter-row">
            <select id="filterType" onchange="render()"><option value="all">全部</option><option value="expense">支出</option><option value="income">收入</option></select>
            <select id="filterCat" onchange="render()"><option value="all">分類</option></select>
            <select id="filterAccount" onchange="render()"><option value="all">支付方式</option></select>
          </div>
          <div class="filter-row">
            <input id="search" placeholder="搜尋..." oninput="render()">
          </div>
        </div>
      </div>
      <div id="transactions" style="flex: 1;"></div>
    </section>

    <!-- 右側欄位：近 7 日支出 & 支出分類 -->
    <div class="right-col">
      <section class="card">
        <div class="section-title"><h2>近 7 日支出</h2></div>
        <div class="bars" id="bars"></div>
      </section>

      <section class="card" style="flex: 1; display: flex; flex-direction: column;">
        <div class="section-title"><h2>支出分類</h2></div>
        <div class="chartbox" style="flex: 1;">
          <div class="pie" id="pie">
            <svg id="pieSvg" viewBox="0 0 360 360" style="width: 100%; height: 100%; display: block; overflow: visible;"></svg>
            <div class="pie-center" id="pieCenter">
              <span>本月支出</span>
              <b>$0</b>
            </div>
            <!-- 懸浮提示視窗 -->
            <div class="pie-tooltip" id="pieTooltip"></div>
          </div>
        </div>
        <div class="legend" id="legend"></div>
      </section>
    </div>
  </div>

  <!-- 頁面左下方清除資料按鈕 -->
  <div style="margin-top: 24px; display: flex; justify-content: flex-start;">
    <button type="button" class="smallbtn danger" style="padding: 10px 16px; font-size: 16px; border-radius: 12px; font-weight: 700;" onclick="askClearAllData()">清除所有資料</button>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="dialog">
    <h2 id="modalTitle">新增一筆記帳</h2>
    <form class="form" onsubmit="saveTx(event)">
      <div class="field">
        <label>品項</label>
        <input id="item" placeholder="" required maxlength="40">
      </div>

      <div class="form-row">
        <div class="field">
          <label>類型</label>
          <div class="type">
            <button type="button" id="expenseBtn" class="active" onclick="setType('expense')">支出</button>
            <button type="button" id="incomeBtn" onclick="setType('income')">收入</button>
          </div>
        </div>
        <div class="field">
          <label>金額</label>
          <input 
            id="amount" 
            type="text" 
            inputmode="numeric" 
            pattern="[0-9]*" 
            placeholder="" 
            required 
            onkeydown="filterAmountKey(event)"
            oninput="cleanAmountInput(this)"
          >
        </div>
      </div>

      <div class="form-row">
        <div class="field"><label>分類</label><select id="category"></select></div>
        <div class="field">
          <label>支付方式</label>
          <select id="account">
            <option>現金</option>
            <option>信用卡</option>
          </select>
        </div>
      </div>

      <div class="field"><label>日期</label><input id="date" type="date" required></div>

      <div class="field">
        <label>備註</label>
        <input id="note" maxlength="60" placeholder="">
      </div>

      <div class="actions">
        <button type="button" class="cancel" onclick="closeModal()">取消</button>
        <button type="submit" class="primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="confirmModal" onclick="if(event.target===this)closeConfirmModal()">
  <div class="dialog" style="max-width: 400px;">
    <h2>確認刪除</h2>
    <p style="color: var(--muted); margin-bottom: 20px;">確定要刪除這筆紀錄嗎？刪除後無法恢復。</p>
    <div class="actions">
      <button type="button" class="cancel" onclick="closeConfirmModal()">取消</button>
      <button type="button" class="btn-danger" onclick="confirmDeleteTx()">確認刪除</button>
    </div>
  </div>
</div>

<div class="modal" id="clearModal" onclick="if(event.target===this)closeClearModal()">
  <div class="dialog" style="max-width: 400px;">
    <h2>確認清除全部</h2>
    <p style="color: var(--muted); margin-bottom: 20px;">確定要清除所有的記帳資料嗎？此操作無法復原。</p>
    <div class="actions">
      <button type="button" class="cancel" onclick="closeClearModal()">取消</button>
      <button type="button" class="btn-danger" onclick="confirmClearAllData()">確認清除</button>
    </div>
  </div>
</div>

<script>
const cats = {
  expense: [["🍔","飲食"],["🚇","交通"],["🛍️","購物"],["🏠","生活"],["🎮","娛樂"],["💊","醫療"],["📚","學習"],["📦","其他"]],
  income: [["💰","薪資"],["🎁","獎金"],["📈","投資"],["💵","其他收入"]]
};

const catColors = {
  "飲食": "#e95c68",
  "交通": "#2aa6b8",
  "購物": "#7c5cff",
  "生活": "#f59e0b",
  "娛樂": "#5b67f1",
  "醫療": "#16a673",
  "學習": "#9b59b6",
  "其他": "#778196"
};

const accountList = ["現金","信用卡"];
let type = "expense", editId = null, deleteTargetId = null;

function getLocalDateStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function ym(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

const money = n => "$" + Number(n).toLocaleString("zh-TW");

let data = JSON.parse(localStorage.getItem("money_book") || "null");
if (!data || data.length === 0) {
  const today = getLocalDateStr();
  data = [
    { id: 1, item: "月票", type: "expense", amount: 1200, category: "交通", account: "現金", date: today, note: "8月份" },
    { id: 2, item: "課金", type: "expense", amount: 1650, category: "娛樂", account: "信用卡", date: today, note: "禮包" },
    { id: 3, item: "bouns", type: "income", amount: 3000000, category: "獎金", account: "現金", date: today, note: "bouns" },
    { id: 4, item: "午餐", type: "expense", amount: 300, category: "飲食", account: "現金", date: today, note: "" }
  ];
  localStorage.setItem("money_book", JSON.stringify(data));
}

let viewMonth = new Date(); 
viewMonth.setDate(1);

function setType(t) {
  type = t;
  document.getElementById("expenseBtn").classList.toggle("active", t === "expense");
  document.getElementById("incomeBtn").classList.toggle("active", t === "income");
  fillCats();
}

function fillCats(selected) {
  const catEl = document.getElementById("category");
  catEl.innerHTML = cats[type].map(x => `<option value="${x[1]}">${x[0]} ${x[1]}</option>`).join("");
  if (selected) catEl.value = selected;
}

function iconFor(c) {
  for (const arr of Object.values(cats)) {
    for (const x of arr) if (x[1] === c) return x[0];
  }
  return "🧾";
}

function filterAmountKey(e) {
  if (['.', '-', 'e', 'E', '+', ','].includes(e.key)) {
    e.preventDefault();
  }
}

function cleanAmountInput(input) {
  let val = input.value.replace(/[^0-9]/g, '');
  if (val.length > 1 && val.startsWith('0')) {
    val = val.replace(/^0+/, '');
    if (val === '') val = '0';
  }
  input.value = val;
}

function openModal(id = null) {
  editId = id;
  const modalEl = document.getElementById("modal");
  const modalTitleEl = document.getElementById("modalTitle");
  const itemEl = document.getElementById("item");
  const amountEl = document.getElementById("amount");
  const accountEl = document.getElementById("account");
  const dateEl = document.getElementById("date");
  const noteEl = document.getElementById("note");

  modalEl.classList.add("show");
  modalTitleEl.textContent = id ? "編輯記帳" : "新增一筆記帳";

  if (id) {
    const x = data.find(a => a.id === id);
    itemEl.value = x.item || x.note || "";
    setType(x.type);
    amountEl.value = x.amount;
    fillCats(x.category);
    accountEl.value = x.account || "現金";
    dateEl.value = x.date;
    noteEl.value = x.note || "";
  } else {
    itemEl.value = "";
    setType("expense");
    amountEl.value = "";
    accountEl.value = "現金";
    dateEl.value = getLocalDateStr();
    noteEl.value = "";
  }
  setTimeout(() => itemEl.focus(), 50);
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
  editId = null;
}

function saveTx(e) {
  e.preventDefault();
  const amountEl = document.getElementById("amount");
  const itemEl = document.getElementById("item");
  const categoryEl = document.getElementById("category");
  const accountEl = document.getElementById("account");
  const dateEl = document.getElementById("date");
  const noteEl = document.getElementById("note");

  const rawAmount = parseInt(amountEl.value, 10);
  if (isNaN(rawAmount) || rawAmount <= 0) {
    amountEl.focus();
    return;
  }

  const itemVal = itemEl.value.trim() || categoryEl.value;
  const noteVal = noteEl.value.trim();
  const txDate = dateEl.value || getLocalDateStr();

  const obj = {
    id: editId || Date.now(),
    item: itemVal,
    type,
    amount: rawAmount,
    category: categoryEl.value,
    account: accountEl.value,
    date: txDate,
    note: noteVal
  };

  if (editId) {
    data = data.map(x => x.id === editId ? obj : x);
  } else {
    data.push(obj);
  }

  if (txDate) {
    const [y, m] = txDate.split('-').map(Number);
    if (y && m) {
      viewMonth = new Date(y, m - 1, 1);
    }
  }

  localStorage.setItem("money_book", JSON.stringify(data));
  closeModal();
  render();
}

function askRemoveTx(id) {
  deleteTargetId = id;
  document.getElementById("confirmModal").classList.add("show");
}

function closeConfirmModal() {
  document.getElementById("confirmModal").classList.remove("show");
  deleteTargetId = null;
}

function confirmDeleteTx() {
  if (deleteTargetId) {
    data = data.filter(x => x.id !== deleteTargetId);
    localStorage.setItem("money_book", JSON.stringify(data));
    render();
  }
  closeConfirmModal();
}

function askClearAllData() {
  document.getElementById("clearModal").classList.add("show");
}

function closeClearModal() {
  document.getElementById("clearModal").classList.remove("show");
}

function confirmClearAllData() {
  data = [];
  localStorage.setItem("money_book", JSON.stringify(data));
  render();
  closeClearModal();
}

function changeMonth(n) {
  viewMonth.setMonth(viewMonth.getMonth() + n);
  viewMonth.setDate(1);
  render();
}

function selectCategoryFromPie(cat) {
  const filterCat = document.getElementById("filterCat");
  const filterType = document.getElementById("filterType");
  
  if (filterCat.value === cat) {
    filterCat.value = "all";
  } else {
    filterCat.value = cat;
    if (filterType.value === "income") {
      filterType.value = "all";
    }
  }
  render();

  if (window.innerWidth <= 800) {
    const txSection = document.getElementById("transactions");
    if (txSection) txSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function render() {
  const m = ym(viewMonth);
  const month = data.filter(x => x.date && x.date.startsWith(m));
  document.getElementById("monthLabel").textContent = `${viewMonth.getFullYear()} 年 ${viewMonth.getMonth() + 1} 月`;

  const inc = month.filter(x => x.type === "income").reduce((a, x) => a + x.amount, 0);
  const exp = month.filter(x => x.type === "expense").reduce((a, x) => a + x.amount, 0);

  const incEl = document.getElementById("income");
  const expEl = document.getElementById("expense");
  const balEl = document.getElementById("balance");

  incEl.textContent = money(inc);
  expEl.textContent = money(exp);
  balEl.textContent = money(inc - exp);
  balEl.className = "value " + (inc - exp < 0 ? "expense" : "income");

  const filterCat = document.getElementById("filterCat");
  const filterAccount = document.getElementById("filterAccount");
  const filterType = document.getElementById("filterType");
  const searchInput = document.getElementById("search");

  const catsSet = [...new Set(month.map(x => x.category))];
  const accSet = [...new Set(month.map(x => x.account || "現金"))];
  const oldC = filterCat.value, oldA = filterAccount.value;

  filterCat.innerHTML = '<option value="all">分類</option>' + catsSet.map(c => `<option>${c}</option>`).join("");
  filterCat.value = catsSet.includes(oldC) ? oldC : "all";

  filterAccount.innerHTML = '<option value="all">支付方式</option>' + accSet.map(a => `<option>${a}</option>`).join("");
  filterAccount.value = accSet.includes(oldA) ? oldA : "all";

  const ft = filterType.value;
  const q = (searchInput.value || "").toLowerCase();
  const fc = filterCat.value;
  const fa = filterAccount.value;

  const list = month.filter(x => {
    const titleText = (x.item || x.note || x.category);
    const matchType = ft === "all" || x.type === ft;
    const matchCat = fc === "all" || x.category === fc;
    const matchAcc = fa === "all" || (x.account || "現金") === fa;
    const matchSearch = (titleText + x.category + (x.note || "")).toLowerCase().includes(q);
    return matchType && matchCat && matchAcc && matchSearch;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

  const txContainer = document.getElementById("transactions");
  txContainer.innerHTML = list.length ? list.map(x => {
    const mainTitle = esc(x.item || x.note || x.category);
    const subNote = x.note && x.note !== x.item ? `<div class="tx-note">備註：${esc(x.note)}</div>` : '';
    return `
      <div class="tx">
        <div class="icon">${iconFor(x.category)}</div>
        <div class="tx-main">
          <div class="tx-title">${mainTitle}</div>
          <div class="tx-meta">${x.category} · ${x.date} · ${x.account || "現金"}</div>
          ${subNote}
        </div>
        <div class="amount ${x.type === "income" ? "plus" : "minus"}">
          ${x.type === "income" ? "+" : "−"}${money(x.amount).slice(1)}
        </div>
        <div class="tx-actions">
          <button class="smallbtn" onclick="openModal(${x.id})">編輯</button>
          <button class="smallbtn danger" onclick="askRemoveTx(${x.id})">刪除</button>
        </div>
      </div>
    `;
  }).join("") : '<div class="empty">目前沒有符合條件的紀錄</div>';

  renderPie(month);
  renderBars();
}

function getSectorPath(cx, cy, rOut, rIn, startDeg, endDeg) {
  const rad = deg => (deg - 90) * Math.PI / 180;
  const x1 = cx + rOut * Math.cos(rad(startDeg));
  const y1 = cy + rOut * Math.sin(rad(startDeg));
  const x2 = cx + rOut * Math.cos(rad(endDeg));
  const y2 = cy + rOut * Math.sin(rad(endDeg));

  const x3 = cx + rIn * Math.cos(rad(endDeg));
  const y3 = cy + rIn * Math.sin(rad(endDeg));
  const x4 = cx + rIn * Math.cos(rad(startDeg));
  const y4 = cy + rIn * Math.sin(rad(startDeg));

  const largeArc = (endDeg - startDeg) > 180 ? 1 : 0;

  return `M ${x1} ${y1} A ${rOut} ${rOut} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${rIn} ${rIn} 0 ${largeArc} 0 ${x4} ${y4} Z`;
}

function showTooltip(e, cat, val, pct) {
  const tooltip = document.getElementById("pieTooltip");
  if (!tooltip) return;
  tooltip.innerHTML = `<div>${iconFor(cat)} ${cat}</div><div style="font-size:14px; opacity:0.85; margin-top:2px;">${money(val)} (${pct}%)</div>`;
  tooltip.classList.add("show");
  moveTooltip(e);
}

function moveTooltip(e) {
  const tooltip = document.getElementById("pieTooltip");
  const pie = document.getElementById("pie");
  if (!tooltip || !pie) return;
  const rect = pie.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  tooltip.style.left = `${x}px`;
  tooltip.style.top = `${y}px`;
}

function hideTooltip() {
  const tooltip = document.getElementById("pieTooltip");
  if (tooltip) tooltip.classList.remove("show");
}

function renderPie(month) {
  const pieSvg = document.getElementById("pieSvg");
  const pieCenter = document.getElementById("pieCenter");
  const legend = document.getElementById("legend");
  const currentSelectedCat = document.getElementById("filterCat").value;

  const sums = {};
  month.filter(x => x.type === "expense").forEach(x => sums[x.category] = (sums[x.category] || 0) + x.amount);
  const rows = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const total = rows.reduce((a, x) => a + x[1], 0);

  if (currentSelectedCat !== "all" && sums[currentSelectedCat] !== undefined) {
    pieCenter.innerHTML = `<span style="font-size:15px; color:var(--primary); font-weight:800;">${iconFor(currentSelectedCat)} ${esc(currentSelectedCat)}</span><b style="font-size:24px; margin-top:2px;">${money(sums[currentSelectedCat])}</b>`;
  } else {
    pieCenter.innerHTML = `<span>本月支出</span><b>${money(total)}</b>`;
  }

  const palette = ["#5b67f1", "#7c5cff", "#16a673", "#e95c68", "#f59e0b", "#2aa6b8", "#9b59b6", "#778196"];

  if (!total) {
    pieSvg.innerHTML = '<circle cx="180" cy="180" r="138" fill="none" stroke="#e9edf3" stroke-width="80" />';
    legend.innerHTML = '<div class="empty" style="padding:5px">本月還沒有支出</div>';
    hideTooltip();
    return;
  }

  let pathsHtml = "";

  if (rows.length === 1) {
    const singleColor = catColors[rows[0][0]] || palette[0];
    const isSel = currentSelectedCat === rows[0][0];
    const sliceClass = "pie-slice" + (currentSelectedCat !== "all" ? (isSel ? " selected" : " dimmed") : "");
    pathsHtml = `<circle class="${sliceClass}" cx="180" cy="180" r="138" fill="none" stroke="${singleColor}" stroke-width="80" onclick="selectCategoryFromPie('${esc(rows[0][0])}')" onmouseenter="showTooltip(event, '${esc(rows[0][0])}', ${rows[0][1]}, 100)" onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()" />`;
  } else {
    let currentDeg = 0;
    rows.forEach(([c, v], i) => {
      const p = v / total;
      const deg = p * 360;
      const startDeg = currentDeg;
      const endDeg = currentDeg + deg;
      currentDeg = endDeg;

      const color = catColors[c] || palette[i % palette.length];
      const pathD = getSectorPath(180, 180, 178, 98, startDeg, endDeg);
      const pct = Math.round(p * 100);
      const isSel = currentSelectedCat === c;
      const isAnySel = currentSelectedCat !== "all";
      const sliceClass = "pie-slice" + (isAnySel ? (isSel ? " selected" : " dimmed") : "");

      pathsHtml += `<path class="${sliceClass}" d="${pathD}" fill="${color}" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" onclick="selectCategoryFromPie('${esc(c)}')" onmouseenter="showTooltip(event, '${esc(c)}', ${v}, ${pct})" onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()" />`;
    });
  }

  pieSvg.innerHTML = pathsHtml;
  legend.innerHTML = rows.map(([c, v], i) => {
    const color = catColors[c] || palette[i % palette.length];
    const isSel = currentSelectedCat === c;
    return `
      <div class="legend-row ${isSel ? 'selected' : ''}" onclick="selectCategoryFromPie('${esc(c)}')">
        <i class="dot" style="background:${color}"></i>
        <span>${iconFor(c)} ${c}</span>
        <span class="val">${money(v)} · ${Math.round(v / total * 100)}%</span>
      </div>
    `;
  }).join("");
}

function renderBars() {
  const bars = document.getElementById("bars");
  const d = [];
  for (let i = 6; i >= 0; i--) {
    const dt = new Date();
    dt.setDate(dt.getDate() - i);
    const s = getLocalDateStr(dt);
    d.push({
      n: dt.getDate(),
      v: data.filter(x => x.date === s && x.type === "expense").reduce((a, x) => a + x.amount, 0)
    });
  }
  const max = Math.max(...d.map(x => x.v), 1);
  bars.innerHTML = d.map(x => `
    <div class="bar-wrap" title="${money(x.v)}">
      <div class="bar" style="height:${Math.max(4, x.v / max * 170)}px"></div>
      <div class="bar-label">${x.n}日</div>
    </div>
  `).join("");
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

fillCats();
render();
</script>
